format:
  pdf:
    papersize: a5
    header-includes:
     - \usepackage{braket}
    title-block-style: none
    margin: 15mm
    toc: true
    number-sections: true
    documentclass: scrbook
    include-in-header:
      text: 
         \usepackage{pdfpages}
         \renewcommand*{\partpagestyle}{empty}
         \usepackage{makeidx}
         \makeindex
    include-before-body:
      text: 
        \includepdf[pages=1]{oi-cover.pdf}
    include-after-body:
      text: 
        \printindex
  epub:
    epub-cover-image: oi-cover.png
  html: 
    theme: cosmo

bibliography: references.bib

